version: '3.8'

services:

  user-service:
    build: ./user-service
    container_name: user-service
    volumes:
      - ./user-service:/var/www
    ports:
      - "8001:8000"
    depends_on:
      - user-db
    command: php artisan serve --host=0.0.0.0 --port=8000

  user-db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: user_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"

  order-service:
    build: ./order-service
    container_name: order-service
    volumes:
      - ./order-service:/var/www
    ports:
      - "8002:8000"
    depends_on:
      - order-db
    command: php artisan serve --host=0.0.0.0 --port=8000

  order-db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: order_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"

  gateway:
    build: ./api-gateway
    container_name: gateway
    ports:
      - "8003:80"
    depends_on:
      - user-service
      - order-service