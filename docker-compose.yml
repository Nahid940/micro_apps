version: '3.8'

services:

  user-service:
    build: ./user-service
    container_name: user-service
    volumes:
      - ./user-service:/var/www
    depends_on:
      - user-db
    expose:
      - "9000"
    networks:
      - app-network
    #command: php artisan serve --host=0.0.0.0 --port=8000

  user-nginx:
    image: nginx:latest
    container_name: user-nginx
    ports:
      - "8081:80"
    volumes:
      - ./user-service:/var/www
      - ./user-service/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - user-service
    networks:
      - app-network

  user-db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: user_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    networks:
      - app-network

  order-service:
    build: ./order-service
    container_name: order-service
    volumes:
      - ./order-service:/var/www
    depends_on:
      - order-db
    expose:
      - "9000"
    networks:
      - app-network
    #command: php artisan serve --host=0.0.0.0 --port=8000

  order-nginx:
    image: nginx:latest
    container_name: order-nginx
    ports:
      - "8082:80"
    volumes:
      - ./order-service:/var/www
      - ./order-service/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - order-service
    networks:
      - app-network

  order-db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: order_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    networks:
      - app-network

  gateway:
    build: ./api-gateway
    container_name: gateway
    ports:
      - "8003:80"
    depends_on:
      - user-nginx
      - order-nginx
    networks:
    - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # messaging port
      - "15672:15672" # dashboard UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - app-network

  
networks:
  app-network:
    driver: bridge